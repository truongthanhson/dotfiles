# Hyprland desktop configuration. i3 remains the rollback session in LightDM.
# Default display state is safe WORK mode; Sunshine may switch to the dummy.

$mainMod = ALT
$terminal = kitty
# Search both desktop applications and every executable on PATH (including
# ~/.local/bin); no per-application .desktop files are required.
$menu = rofi -show combi -combi-modes "drun,run"

# A reload is an unconditional local-display recovery path.
monitor = DP-1,2560x1440@240,0x0,1
monitor = HDMI-A-1,disable
monitor = ,preferred,auto,1

input {
    kb_layout = us
    repeat_rate = 25
    repeat_delay = 500
    follow_mouse = 0
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(cba6f7) 45deg
    col.inactive_border = rgb(45475a)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
}

animations {
    # Subtle transitions only: fast, gentle, nothing flashy.
    # Speed is duration-scaled (lower = faster); tuned snappy.
    enabled = true

    # Ease-out curves: quick start, soft settle, no bounce.
    bezier = easeOut, 0.25, 1, 0.5, 1
    bezier = smoothDamp, 0.22, 1, 0.36, 1

    # Focus switching (Alt+Space / Alt+H,J,K,L): no animation.
    animation = border, 0, 5, easeOut

    # Window open/close: soft pop-in from 90% size.
    animation = windowsIn, 1, 5, easeOut, popin 90%
    animation = windowsOut, 1, 5, easeOut, popin 90%
    # Windows glide when moved (Alt+Shift+arrows) or the layout reflows.
    animation = windowsMove, 1, 5, smoothDamp

    # Popups, menus, and layer surfaces (topbar, rofi) fade gently.
    animation = fade, 1, 5, easeOut
    animation = layersIn, 1, 5, easeOut, fade
    animation = layersOut, 1, 5, easeOut, fade

    # Workspace switching (Alt+1-0): no animation.
    animation = workspaces, 0, 2, smoothDamp, slide
    animation = specialWorkspace, 1, 2, smoothDamp, slide
}

dwindle {
    # New tiled windows split to the right (or below for vertical splits).
    force_split = 2
    preserve_split = true
}

# Groups are Hyprland's tabbed-window equivalent; show their tab bar.
group {
    groupbar {
        enabled = true
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Fcitx5 input method: Vietnamese (Bamboo) + English. IBus cannot use
# Hyprland's zwp_input_method_v2 (it only speaks v1), so we use Fcitx5, which
# supports it natively. GTK/Qt apps use the fcitx IM modules, XWayland apps XIM.
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Wayland session services. Do not start Picom, xss-lock, i3lock, i3bar,
# or XRandR display scripts. Publish this exact Hyprland instance before the
# systemd-managed Sunshine service starts, avoiding environment/startup races.
exec-once = /home/snow/.local/bin/hypr-session-services.sh
# Snow Topbar (rollback: restore the Waybar line below)
exec-once = /home/snow/projects/topbar/bin/topbar start
# exec-once = waybar
# Notifications are served by the topbar shell itself (rollback: uncomment).
# exec-once = mako
exec-once = hypridle
# Fcitx5 input-method daemon (Vietnamese Bamboo + English).
exec-once = fcitx5 -d
# Random wallpaper from ~/Pictures/Wallpaper, redrawn on every login.
exec-once = /home/snow/.local/bin/wallpaper

# Applications and session controls
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, firefox
bind = $mainMod, B, exec, slack --password-store=gnome-libsecret
bind = $mainMod, N, exec, nautilus
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, SPACE, togglefloating,
# Hold Alt and drag a floating window: left button moves, right button resizes.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, SPACE, cyclenext,
# Input method toggles natively in Fcitx5 (Control+Shift+space; see ~/.config/fcitx5/config).
# Stream display controls; F2 remains a local recovery path if a stream fails.
bind = $mainMod SHIFT, F1, exec, /home/snow/.local/bin/stream-mode.sh
bind = $mainMod SHIFT, F2, exec, /home/snow/.local/bin/work-mode.sh

# Window groups (tabbed windows): create/toggle a group, join the group in a
# direction, switch its active tab, or remove the focused tab.
bind = $mainMod, G, togglegroup,
bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, J, moveintogroup, d
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup,

bind = SHIFT, F4, exec, shutter --select

# Vim-style directional focus/movement: h/j/k/l = left/down/up/right.
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Audio
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod, F10, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
# Microphone mute mirrors output mute one row up.
bind = $mainMod SHIFT, F10, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod, F11, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = $mainMod, F12, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%

# Capture: saves to ~/Pictures and the clipboard. Smart freezes the screen so a
# click snaps to a window or monitor and a drag takes a freeform region.
bind = $mainMod SHIFT, S, exec, screenshot region
bind = $mainMod SHIFT, A, exec, screenshot
bind = $mainMod SHIFT, F, exec, screenshot fullscreen

# Omarchy-style capture: screen freezes, click snaps to a window or monitor,
# drag takes a freeform region. Saves to ~/Pictures and the clipboard.
bind = , Print, exec, screenshot
bind = SHIFT, Print, exec, screenshot region
bind = CTRL, Print, exec, screenshot fullscreen

# Resize submap; Escape, Return, or Alt+R returns to normal mode.
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , escape, submap, reset
bind = , return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Exit submap: Alt+X shows the available actions, then l/r/s/p. Escape or
# Return cancels. A submap alone is intentionally invisible, hence the notice.
bind = $mainMod, X, exec, notify-send -u normal -t 5000 'Power controls' 'r: reboot   s: shutdown   p: suspend   l: log out   Esc: cancel'; hyprctl dispatch submap exit
submap = exit
bind = , l, exec, hyprctl dispatch exit
bind = , r, exec, systemctl reboot
bind = , s, exec, systemctl poweroff
bind = , p, exec, sh -c 'hyprctl dispatch submap reset; systemctl suspend'
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset
