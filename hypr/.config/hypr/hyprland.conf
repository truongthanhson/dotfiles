# Hyprland desktop configuration. i3 remains the rollback session in LightDM.
# Default display state is safe WORK mode; Sunshine may switch to the dummy.

$mainMod = ALT
$terminal = kitty
# Search both desktop applications and every executable on PATH (including
# ~/.local/bin); no per-application .desktop files are required.
$menu = rofi -show combi -combi-modes "drun,run"

# A reload is an unconditional local-display recovery path.
monitor = DP-1,2560x1440@240,0x0,1
monitor = HDMI-A-1,disable
monitor = ,preferred,auto,1

input {
    kb_layout = us
    repeat_rate = 40
    repeat_delay = 240
    follow_mouse = 0
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(cba6f7) 45deg
    col.inactive_border = rgb(45475a)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
}

animations {
    # No transitions: windows and workspace changes appear immediately.
    enabled = false
}

dwindle {
    # New tiled windows split to the right (or below for vertical splits).
    force_split = 2
    preserve_split = true
}

# Groups are Hyprland's tabbed-window equivalent; show their tab bar.
group {
    groupbar {
        enabled = true
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Fcitx5 input method: Vietnamese (Bamboo) + English. IBus cannot use
# Hyprland's zwp_input_method_v2 (it only speaks v1), so we use Fcitx5, which
# supports it natively. GTK/Qt apps use the fcitx IM modules, XWayland apps XIM.
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# Wayland session services. Do not start Picom, xss-lock, i3lock, i3bar,
# or XRandR display scripts. Publish this exact Hyprland instance before the
# systemd-managed Sunshine service starts, avoiding environment/startup races.
exec-once = /home/snow/.local/bin/hypr-session-services.sh
# Snow Topbar (rollback: restore the Waybar line below)
exec-once = /home/snow/projects/topbar/bin/topbar start
# exec-once = waybar
exec-once = mako
exec-once = hypridle
# Fcitx5 input-method daemon (Vietnamese Bamboo + English).
exec-once = fcitx5 -d

# Applications and session controls
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, firefox
bind = $mainMod, B, exec, slack --password-store=gnome-libsecret
bind = $mainMod, N, exec, nautilus
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, SPACE, togglefloating,
# Hold Alt and drag a floating window: left button moves, right button resizes.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, SPACE, cyclenext,
# Input method: toggle English <-> Vietnamese (Bamboo). Fcitx5 cannot grab
# global keys reliably on Wayland, so Hyprland dispatches the toggle.
bind = CTRL, SPACE, exec, fcitx5-remote -t
bind = SUPER, SPACE, exec, fcitx5-remote -t
# Stream display controls; F2 remains a local recovery path if a stream fails.
bind = $mainMod SHIFT, F1, exec, /home/snow/.local/bin/stream-mode.sh
bind = $mainMod SHIFT, F2, exec, /home/snow/.local/bin/work-mode.sh

# Window groups (tabbed windows): create/toggle a group, join the group in a
# direction, switch its active tab, or remove the focused tab.
bind = $mainMod, G, togglegroup,
bind = $mainMod CTRL, J, moveintogroup, l
bind = $mainMod CTRL, K, moveintogroup, d
bind = $mainMod CTRL, L, moveintogroup, u
bind = $mainMod CTRL, semicolon, moveintogroup, r
bind = $mainMod, TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup,

bind = SHIFT, F4, exec, shutter --select

# i3-compatible directional focus/movement: j/k/l/; = left/down/up/right.
bind = $mainMod, J, movefocus, l
bind = $mainMod, K, movefocus, d
bind = $mainMod, L, movefocus, u
bind = $mainMod, semicolon, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod SHIFT, J, movewindow, l
bind = $mainMod SHIFT, K, movewindow, d
bind = $mainMod SHIFT, L, movewindow, u
bind = $mainMod SHIFT, semicolon, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Audio
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod, F10, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod, F11, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = $mainMod, F12, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%

# Native Wayland area screenshot, copied to clipboard.
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Resize submap; Escape, Return, or Alt+R returns to normal mode.
bind = $mainMod, R, submap, resize
submap = resize
binde = , J, resizeactive, -40 0
binde = , K, resizeactive, 0 40
binde = , L, resizeactive, 0 -40
binde = , semicolon, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , escape, submap, reset
bind = , return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Exit submap: Alt+X shows the available actions, then l/r/s/p. Escape or
# Return cancels. A submap alone is intentionally invisible, hence the notice.
bind = $mainMod, X, exec, notify-send -u normal -t 5000 'Power controls' 'r: reboot   s: shutdown   p: suspend   l: log out   Esc: cancel'; hyprctl dispatch submap exit
submap = exit
bind = , l, exec, hyprctl dispatch exit
bind = , r, exec, systemctl reboot
bind = , s, exec, systemctl poweroff
bind = , p, exec, sh -c 'hyprctl dispatch submap reset; systemctl suspend'
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset
