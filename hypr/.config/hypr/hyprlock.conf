general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(11111bff)
}

input-field {
    monitor =
    size = 280, 54
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrainsMonoNL Nerd Font Mono
    position = 0, 90
    halign = center
    valign = center
}
