# Mirrors alacritty/.config/alacritty/alacritty.toml

font_family      FiraCode Nerd Font
font_size        16.0

hide_window_decorations yes
#background_opacity 0.9

# Alacritty default palette (alacritty.toml has no [colors] section)
background #1d1f21
foreground #c5c8c6

cursor none
selection_foreground none
selection_background none

color0  #1d1f21
color8  #666666
color1  #cc6666
color9  #d54e53
color2  #b5bd68
color10 #b9ca4a
color3  #f0c674
color11 #e7c547
color4  #81a2be
color12 #7aa6da
color5  #b294bb
color13 #c397d8
color6  #8abeb7
color14 #70c0b1
color7  #c5c8c6
color15 #eaeaea
