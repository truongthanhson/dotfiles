# Hyprland Wayland capture with NVENC encoding. output_name intentionally stays
# unset because preparation leaves exactly one active output before capture.
capture = wlr
nvenc_preset = 1
nvenc_twopass = disabled
hevc_mode = 1
av1_mode = 1
# Display switching is mandatory; optional performance tuning runs afterward.
global_prep_cmd = [{"do":"/home/snow/.local/bin/sunshine-session-mode.sh do","undo":"/home/snow/.local/bin/sunshine-session-mode.sh undo"}]
