set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB"

# snappier Esc/mode-switch in neovim, and let nvim autoread/gitsigns react to focus
set -sg escape-time 10
set -g focus-events on

# change "prefix" from Ctrl-b to Ctrl-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# remap | and - for split window vertically and horizontally respectively
unbind %
bind-key | split-window -h
unbind '"'
bind-key - split-window -v

# map prefix + r to resource tmux config
unbind r
bind-key r source-file ~/.tmux.conf

# map utilities keys to resize pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
# allow using mouse to resize pane
set -g mouse on

# prefix + [ to enter vi mode where you can
# copy select + copy content of pane
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# plugin manager of tmux
# need to run this command first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm 

set -g @plugin 'tmux-plugins/tpm'

# tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# Load catppuccin
run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
run ~/.tmux/plugins/tmux-plugins/tmux-battery/battery.tmux

set -g @catppuccin_flavour 'latte' # or latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_window_current_text "#{window_name}"
set -g @catppuccin_window_text "#{window_name}"
# set -g @themepack 'powerline/default/cyan'

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
# alert! This must be the last line for the tpm working properly
run '~/.tmux/plugins/tpm/tpm'
